  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Get dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Package Linux Build
        run: |
          cp -r build/linux/x64/release/bundle puzzle-games-linux
          tar -czf puzzle-games-linux.tar.gz puzzle-games-linux
      
      - name: Confirm Linux Success
        run: echo "Linux build and packaging completed successfully."
      
